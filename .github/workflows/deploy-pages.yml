name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 6 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  NUXT_PUBLIC_SUPABASE_URL: ${{ vars.NUXT_PUBLIC_SUPABASE_URL }}
  NUXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.NUXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
  # Project pages live under /<repo>/; set the NUXT_APP_BASE_URL variable to / once a custom domain is used.
  NUXT_APP_BASE_URL: ${{ vars.NUXT_APP_BASE_URL || format('/{0}/', github.event.repository.name) }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          cache: npm
      - run: npm ci
      - run: npm run test:unit
      - run: node scripts/prerender-routes.mjs
      - run: npx nuxt generate
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .output/public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # If Pages Source is "Deploy from a branch", GitHub also runs its own Jekyll build that can finish after
  # this deploy and replace the site with the README. Fail loudly instead of silently serving it.
  verify:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - run: |
          sleep 150
          if curl -fsSL "${{ needs.deploy.outputs.page_url }}" | grep -qi 'content="Jekyll'; then
            echo "::error::The live site is the Jekyll README build. Set Settings > Pages > Source to GitHub Actions."
            exit 1
          fi
